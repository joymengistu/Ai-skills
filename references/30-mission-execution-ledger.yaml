mission_program: ai-skills-30-mission-top-tier
source: contributions/master-research-mission-maximum-improvement-original.txt
status: in_progress
current_mission: 7
next_mission: 8
rules:
  - audit_before_editing
  - distinguish_fact_evidence_inference_hypothesis_unknown
  - require_before_after_evidence
  - preserve_user_authority
  - prefer_smallest_sufficient_change
  - never_claim_unmeasured_improvement
missions:
  1:
    title: Audit the entire repository and create a capability gap baseline
    status: complete
    artifacts:
      - references/skill-catalog-capability-map.json
      - references/skill-catalog-audit-2026-08-23.md
      - scripts/audit_skill_catalog.py
      - contributions/master-research-mission-maximum-improvement-original.txt
    evidence:
      - 63 Skills inventoried from repository SKILL.md files
      - structural metadata and observable signals recorded conservatively
      - flagged items require substantive review; flags are not quality failures
    result: baseline_created
    limitations:
      - structural signals do not prove that a Skill works
      - aggregate benchmark comparison remains not_run without measured model arms
  2:
    title: Define and integrate calibrated quality vocabulary
    status: complete
    artifacts:
      - references/quality-vocabulary.md
      - core/self-directing-prompt.md
      - skills/agent-max/SKILL.md
      - evals/cases.jsonl
      - evals/intelligence-benchmark.json
    evidence:
      - shared vocabulary defines target, scope, constraints, evidence, budget, and stopping semantics
      - core prompt and Agent Max route intensity words to the focused reference
      - five evaluation cases cover best, maximum effort, perfection, quick/simple, and human-centered top-tier requests
    result: calibrated_quality_route_created
    limitations:
      - benchmark comparison remains not_run without measured model arms
  3:
    title: Strengthen intent preservation and clarification behavior
    status: complete
    artifacts:
      - references/intent-resolution-contract.md
      - skills/intent-preservation/SKILL.md
      - core/self-directing-prompt.md
      - evals/cases.jsonl
      - evals/intelligence-benchmark.json
    evidence:
      - ambiguity records separate candidate intents, evidence, confidence, impact, reversibility, and correction scope
      - core and Intent Preservation route consequential ambiguity through the shared contract
      - four evaluations cover conflicting references, broad authority, correction precedence, and prediction-versus-permission
    result: intent_resolution_route_created
    limitations:
      - no live user study or measured model-arm comparison has been run
  4:
    title: Add difficulty, risk, effort, and proportionality classification
    status: complete
    artifacts:
      - references/task-classification-contract.md
      - core/ultra-plan-mode.md
      - skills/ultra-plan/SKILL.md
      - skills/agent-max/SKILL.md
      - evals/cases.jsonl
      - evals/intelligence-benchmark.json
    evidence:
      - eight task dimensions map to Focused, Deep, or Ultra planning and approval gates
      - high consequence, irreversibility, external effect, or sensitivity overrides prompt length
      - four evaluations cover overplanning, high-risk short prompts, exhaustive loading, and ambiguous deadlines
    result: proportional_task_classification_created
    limitations:
      - classification remains a reasoning contract and has not been calibrated on measured production trajectories
  5:
    title: Standardize objective, acceptance, evidence, and stopping contracts
    status: complete
    artifacts:
      - references/completion-contract.md
      - skills/outcome-completion/SKILL.md
      - core/self-directing-prompt.md
      - evals/cases.jsonl
      - evals/intelligence-benchmark.json
    evidence:
      - completion record separates outcome, acceptance, evidence, quality, safety, recovery, and human-value gates
      - statuses distinguish complete, caveated, needs_review, blocked, and not_started
      - four evaluations cover build-versus-product evidence, visual claims, missing error tests, and diminishing returns
    result: shared_completion_contract_created
    limitations:
      - benchmark comparison remains not_run without measured model arms
  6:
    title: Research source hierarchy, freshness, and independence
    status: complete
    artifacts:
      - references/source-hierarchy-research-2026-08-23.md
      - references/source-hierarchy-policy.md
      - skills/research/SKILL.md
      - core/self-directing-prompt.md
      - evals/cases.jsonl
      - evals/intelligence-benchmark.json
    evidence:
      - W3C PROV-DM, NIST AI RMF, GO FAIR, and a current academic survey were read and recorded
      - policy defines source tiers, claim-to-source matching, freshness classes, independence groups, provenance, and contradiction workflow
      - four evaluations cover copied sources, stale API documentation, bounded research claims, and disappeared sources
    result: source_quality_policy_created
    limitations:
      - freshness windows are operating defaults, not universally validated decay laws
      - no causal model-performance gain has been measured yet
  7:
    title: Upgrade evidence ledgers and claim provenance
    status: complete
    artifacts:
      - runtime/evidence-ledger.schema.json
      - runtime/evidence-ledger.example.json
      - runtime/reference_host/evidence_ledger.py
      - runtime/reference_host/test_evidence_ledger.py
      - references/source-hierarchy-policy.md
      - evals/cases.jsonl
      - evals/intelligence-benchmark.json
    evidence:
      - schema records claim type, source reference, tier, span, retrieval, transformations, derivation, corroboration, contradiction, scope, freshness, status, confidence, and verification
      - reference host rejects missing required fields, duplicate evidence IDs, unsupported confidence/status combinations, and missing evidence links
      - 20 reference-host tests and the full repository validation suite pass
    result: evidence_ledger_provenance_layer_created
    limitations:
      - adapter is reference-grade and does not provide cryptographic truth or source availability
  8:
    title: Add citation cross-checking and contradiction handling
    status: next
    planned_artifacts:
      - contradiction-resolution protocol
      - cross-checking evaluations
